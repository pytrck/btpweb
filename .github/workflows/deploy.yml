name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync Google reviews
        run: node scripts/sync-google-reviews.mjs
        env:
          GOOGLE_BP_CLIENT_ID: ${{ secrets.GOOGLE_BP_CLIENT_ID }}
          GOOGLE_BP_CLIENT_SECRET: ${{ secrets.GOOGLE_BP_CLIENT_SECRET }}
          GOOGLE_BP_REFRESH_TOKEN: ${{ secrets.GOOGLE_BP_REFRESH_TOKEN }}
      - name: Build static export
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
